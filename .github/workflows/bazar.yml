name: Tibia Bazar Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-bazar:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Uruchom Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Sprawdź bazar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_bazar.py

      - name: Zapisz aktualną listę
        run: |
          git config user.name "Tibia Bazar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add known_characters.json
          git diff --cached --quiet || git commit -m "Update known characters"
          git push
